name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Install Android SDK + NDK
        run: |
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;28.2.13676358"

      - run: chmod +x gradlew

      - name: Fetch Gradle wrapper (retry)
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "Gradle wrapper fetch failed (attempt ${attempt}/5), waiting..."
            sleep 30
          done
          exit 1

      - name: Build protected release APK
        run: |
          set -e
          for attempt in 1 2 3; do
            if ./gradlew assembleRelease --stacktrace --no-daemon; then
              exit 0
            fi
            echo "assembleRelease failed (attempt ${attempt}/3), retrying in 20s..."
            sleep 20
          done
          exit 1

      - name: Verify application APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "${ANDROID_HOME}/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -q "package: name='com.mlbb.esp.pure'"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -q "launchable-activity"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libMlbbEsp\.so'
          echo "OK: protected mlbb-esp-pure release APK"

      - uses: actions/upload-artifact@v4
        with:
          name: mlbb-esp-pure-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
